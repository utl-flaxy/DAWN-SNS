<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAWN SNS | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen flex items-center justify-center bg-gradient-to-b from-[#3E4865] to-[#D05E45] font-sans">

  <div class="text-center w-full max-w-md px-6">
    <img src="img/main_logo.png" alt="DAWN Logo" class="mx-auto w-40 mb-4">
    <h2 class="text-white text-xl font-semibold mb-8">Social Network Service</h2>

    <div class="bg-[rgba(108,108,108,0.1)] p-8 rounded-md shadow-md">
      <h3 class="text-white text-lg mb-6">DAWNのSNSへようこそ</h3>
      <form>
        <div class="mb-4">
          <label class="block text-left text-white mb-2">MailAddress</label>
          <input type="email" placeholder="mail@example.com" class="w-full px-3 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#3E4865]">
        </div>
        <div class="mb-6">
          <label class="block text-left text-white mb-2">Password</label>
          <input type="password" placeholder="********" class="w-full px-3 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#3E4865]">
        </div>
        <button type="submit" class="w-full py-2 bg-[#3E4865] text-white rounded hover:bg-[#2e364c] transition">LOGIN</button>
      </form>

      <p class="text-white mt-6 text-sm">新規ユーザーの方は<a href="register.html" class="underline hover:text-gray-200 ml-1">こちら</a></p>
    </div>
  </div>

</body>
</html>
