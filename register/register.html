<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAWN SNS | Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen flex items-center justify-center bg-gradient-to-b from-[#3E4865] to-[#D05E45] font-sans">

  <div class="text-center w-full max-w-md px-6">
    <img src="img/main_logo.png" alt="DAWN Logo" class="mx-auto w-40 mb-4">
    <h2 class="text-white text-xl font-semibold mb-8">新規ユーザー登録</h2>

    <div class="bg-[rgba(108,108,108,0.1)] p-8 rounded-md shadow-md">
      <form>
        <div class="mb-4">
          <label class="block text-left text-white mb-2">UserName</label>
          <input type="text" placeholder="Dawntown" class="w-full px-3 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#5A659E]">
        </div>

        <div class="mb-4">
          <label class="block text-left text-white mb-2">MailAddress</label>
          <input type="email" placeholder="dawn@dawn.jp" class="w-full px-3 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#5A659E]">
        </div>

        <div class="mb-4">
          <label class="block text-left text-white mb-2">Password</label>
          <input type="password" placeholder="********" class="w-full px-3 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#5A659E]">
        </div>

        <div class="mb-6">
          <label class="block text-left text-white mb-2">Password confirm</label>
          <input type="password" placeholder="********" class="w-full px-3 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#5A659E]">
        </div>

        <button type="submit" class="w-full py-2 bg-[#5A659E] text-white rounded hover:bg-[#4a558e] transition">REGISTER</button>
      </form>

      <p class="text-white mt-6 text-sm">ログイン画面へ戻る <a href="login.html" class="underline hover:text-gray-200 ml-1">こちら</a></p>
    </div>
  </div>

</body>
</html>
