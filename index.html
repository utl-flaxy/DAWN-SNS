<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAWN SNS | Timeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hover-trash:hover img {
      content: url("img/trash_h.png");
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-[#3E4865] to-[#D05E45] text-[#6C6C6C] font-sans">

  <!-- Header -->
  <header class="bg-[#3E4865] text-white flex items-center justify-between px-6 py-3">
    <div class="flex items-center space-x-3">
      <img src="img/main_logo.png" alt="DAWN Logo" class="h-8">
    </div>
    <div class="relative">
      <button id="menuToggle" class="flex items-center space-x-2 focus:outline-none">
        <span>Dawntown さん</span>
        <img src="img/dawn.png" alt="User Icon" class="w-8 h-8 rounded-full border border-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 fill-white" viewBox="0 0 20 20">
          <path d="M5.25 7.5L10 12.25L14.75 7.5H5.25Z" />
        </svg>
      </button>
      <div id="dropdownMenu" class="hidden absolute right-0 mt-2 bg-white text-gray-700 rounded shadow-md w-40">
        <a href="index.html" class="block px-4 py-2 hover:bg-gray-100">HOME</a>
        <a href="edit_profile.html" class="block px-4 py-2 hover:bg-gray-100">プロフィール編集</a>
        <a href="login.html" class="block px-4 py-2 hover:bg-gray-100">ログアウト</a>
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="flex justify-center py-8 px-4">
    <!-- Left (Timeline) -->
    <section class="w-full max-w-2xl mr-8">
      <!-- Post Form -->
      <div class="bg-white rounded-md p-4 mb-6 flex items-center shadow-md">
        <img src="img/dawn.png" alt="User Icon" class="w-10 h-10 rounded-full mr-3">
        <input type="text" placeholder="何をつぶやこうか...？" class="flex-grow border border-gray-300 rounded px-3 py-2 focus:outline-none">
        <button class="ml-3 bg-[#3E4865] p-2 rounded hover:opacity-80 transition">
          <img src="img/post.png" alt="Post" class="w-6">
        </button>
      </div>

      <!-- Post Item -->
      <div class="bg-white rounded-md p-4 mb-4 shadow-md relative group">
        <div class="flex items-center mb-2">
          <img src="img/dawn.png" alt="User Icon" class="w-10 h-10 rounded-full mr-3">
          <div>
            <p class="font-semibold">Dawntown</p>
            <p class="text-xs text-gray-400">2020-09-15 23:32</p>
          </div>
        </div>
        <p class="mb-4">今日はカレーを食べました！<br>野菜もお肉も取れて元気が出る！<br>今度は家で作ろうかな！？</p>
        <div class="absolute right-4 bottom-3 flex space-x-3 opacity-0 group-hover:opacity-100 transition">
          <button><img src="img/edit.png" alt="Edit" class="w-5 h-5"></button>
          <button class="hover-trash"><img src="img/trash.png" alt="Trash" class="w-5 h-5"></button>
        </div>
      </div>

      <!-- Another Post -->
      <div class="bg-white rounded-md p-4 mb-4 shadow-md relative group">
        <div class="flex items-center mb-2">
          <img src="img/dawn.png" alt="User Icon" class="w-10 h-10 rounded-full mr-3">
          <div>
            <p class="font-semibold">DawnEri</p>
            <p class="text-xs text-gray-400">2020-09-15 23:35</p>
          </div>
        </div>
        <p class="mb-4">つぶやいた内容を表示します。</p>
        <div class="absolute right-4 bottom-3 flex space-x-3 opacity-0 group-hover:opacity-100 transition">
          <button><img src="img/edit.png" alt="Edit" class="w-5 h-5"></button>
          <button class="hover-trash"><img src="img/trash.png" alt="Trash" class="w-5 h-5"></button>
        </div>
      </div>
    </section>

    <!-- Right (Sidebar) -->
    <aside class="w-64 bg-white p-4 rounded-md shadow-md">
      <p class="text-sm mb-2">Dawntownさんの</p>
      <div class="flex justify-between items-center mb-2">
        <span>フォロー数</span><a href="#" class="bg-[#3E4865] text-white px-3 py-1 rounded text-sm">12名</a>
      </div>
      <div class="flex justify-between items-center mb-4">
        <span>フォロワー数</span><a href="#" class="bg-[#3E4865] text-white px-3 py-1 rounded text-sm">12000名</a>
      </div>
      <a href="search_user.html" class="block text-center bg-[#3E4865] text-white py-2 rounded hover:bg-[#2E364C] transition">ユーザー検索</a>
    </aside>
  </main>

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const dropdownMenu = document.getElementById('dropdownMenu');
    menuToggle.addEventListener('click', () => dropdownMenu.classList.toggle('hidden'));
  </script>
</body>
</html>
